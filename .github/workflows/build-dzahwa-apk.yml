name: Build D'Zahwa Android Release APK

on:
  push:
    branches:
      - build/dzahwa-apk-v1.3.0
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q dzahwa-source.zip -d project
          cd project
          npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        working-directory: project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with embedded JS bundle
        working-directory: project/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify release APK
        run: |
          test -f project/android/app/build/outputs/apk/release/app-release.apk
          ls -lh project/android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp project/android/app/build/outputs/apk/release/app-release.apk DZahwa-Collections-v1.3.1-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DZahwa-Collections-v1.3.1-Release-APK
          path: DZahwa-Collections-v1.3.1-release.apk
          if-no-files-found: error
